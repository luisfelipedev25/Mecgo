<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e66927">
    <title>Recuperar senha | MecGo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app sem-nav entrada">

    <header class="topbar centro">
        <div class="brand grande">Mec<span>Go</span></div>
        <p class="sub">Recupere o acesso à sua conta.</p>
    </header>

    <main class="content">
        <section class="card">
            <h1 style="font-size:1.2rem;margin-bottom:.4rem">Esqueci minha senha</h1>
            <p class="dica" style="margin-bottom:1rem">Informe o e-mail cadastrado. Enviaremos um link para criar uma nova senha.</p>
            <form action="index.html" method="get">
                <div class="campo"><label for="email">E-mail</label><input type="text" id="email" name="email" placeholder="voce@email.com"></div>
                <button type="submit" class="btn">Enviar link</button>
            </form>
        </section>
        <p class="rodape-link"><a href="index.html">‹ Voltar ao login</a></p>
    </main>
</div>
</body>
</html>
